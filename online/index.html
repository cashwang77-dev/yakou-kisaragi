<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>夜校怪談 Online（測試版）</title>
<style>
:root{--ink:#e8dcc4;--dim:#9a9184;--red:#b0242e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07070a;color:var(--ink);font:15px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
.pane{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:5}
.pane.hide{display:none}
.box{width:min(92vw,420px);background:#141016;border:1px solid #5b4d4d;padding:22px;text-align:center}
.box h1{font:700 24px/1.3 "Noto Serif TC",serif;letter-spacing:.2em;margin:0 0 4px}.box h1 em{color:var(--red);font-style:normal}
.box p{color:var(--dim);font-size:13px;margin:4px 0 14px}
input{font:inherit;padding:8px 10px;width:100%;background:#0c0a0d;color:var(--ink);border:1px solid #5b4d4d;margin:4px 0;touch-action:manipulation}
button{font:inherit;padding:9px 16px;background:#2a1c1e;color:var(--ink);border:1px solid #7a5a5a;cursor:pointer;margin:4px;touch-action:manipulation}
button.go{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:6px}.row input{flex:1}
#hud{position:fixed;left:10px;top:8px;z-index:3;font-size:13px;text-shadow:0 0 4px #000;pointer-events:none}
#hud b{color:#ffd36a}
#chat{position:fixed;left:10px;bottom:10px;width:min(60vw,340px);z-index:4}
#log{max-height:120px;overflow:hidden;font-size:13px;text-shadow:0 0 4px #000;pointer-events:none}
#log div{animation:fade 9s forwards}@keyframes fade{80%{opacity:1}100%{opacity:0}}
#msg{background:rgba(0,0,0,.6)}
#code{font:700 30px/1 monospace;letter-spacing:.3em;color:#ffd36a;margin:8px 0}
#status{position:fixed;right:10px;top:8px;z-index:3;font-size:12px;color:var(--dim);text-align:right}
#endP .box h1{font-size:28px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"></div><div id="status"></div>
<div id="chat"><div id="log"></div><input id="msg" placeholder="按 Enter 聊天" maxlength="60"></div>
<div class="pane" id="lobby"><div class="box">
  <h1>夜校怪談 <em>Online</em></h1><p>測試版・2～4 人合作。找到 3 把鑰匙，大家一起從校門逃出去。<br>被裂口女抓到會倒地——隊友靠近 2 秒可以扶起來。</p>
  <input id="name" placeholder="你的名字" maxlength="8">
  <div><button class="go" id="bHost">建立房間</button></div>
  <div class="row"><input id="joinCode" placeholder="房號（4 碼）" maxlength="4" style="text-transform:uppercase"><button id="bJoin">加入</button></div>
  <p id="lobbyMsg"></p>
</div></div>
<div class="pane hide" id="roomP"><div class="box"><p>把房號告訴朋友，打開同一個網址按「加入」</p><div id="code"></div><p id="who"></p><button class="go" id="bStart">開始（目前人數也可以）</button></div></div>
<div class="pane hide" id="endP"><div class="box"><h1 id="endT"></h1><p id="endS"></p><button class="go" onclick="location.reload()">再玩一次</button></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* 夜校怪談 Online 階段 0（2026-10-29）：PeerJS 點對點，開房的人當主機（裂口女 AI、鑰匙、倒地救援都在主機算），
   其他人送自己的位置、收整個世界狀態。零成本：GitHub Pages ＋ PeerJS 公用連線伺服器。 */
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search),PREFIX='yakou-online-';
const IMG={};for(const n of ['mi','kuchisake','kuchisake_chase']){const i=new Image();i.src='../assets/'+n+'.png';IMG[n]=i;}
/* ---------- 地圖：24x24，#＝牆，K＝鑰匙，G＝校門（出口），S＝出生點，P＝裂口女巡邏點 ---------- */
const MAP=[
'########################',
'#K.....#........#.....P#',
'#......#........#......#',
'#..##..#..####..#..##..#',
'#..##.....#..#.....##..#',
'#.........#..#.........#',
'####..#####..#####..####',
'#P.....................#',
'#..........S...........#',
'#...####.......####....#',
'#...#..#...##..#..#....#',
'#...#..#...##..#..#..K.#',
'#...#..........#..#....#',
'#...####..##...####....#',
'#.........##...........#',
'####..##########..######',
'#.....#........#.......#',
'#..K..#..P.....#...P...#',
'#.....#........#.......#',
'#..................##..#',
'#..####..####......##..#',
'#......................#',
'#P..........GG........P#',
'########################'];
const W=24,H=24,at=(x,y)=>x<0||y<0||x>=W||y>=H?'#':MAP[y|0][x|0];
const solid=(x,y)=>at(Math.floor(x),Math.floor(y))==='#';
const free=(x,y,r=.28)=>!solid(x-r,y-r)&&!solid(x+r,y-r)&&!solid(x-r,y+r)&&!solid(x+r,y+r);
const find=c=>{const o=[];MAP.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch===c)o.push([x+.5,y+.5])}));return o};
const SPAWN=find('S')[0],PATROL=find('P'),GATE=find('G');
const COLS=['#ff7a7a','#7ab8ff','#8be08b','#ffd36a'];
/* ---------- 狀態 ---------- */
let peer=null,isHost=false,myId=null,conns=[],hostConn=null,started=false;
let W0=null;   // 世界：{p:{id:{x,y,d,m,r,down,n,c,rv}},g:{x,y,d,s},k:[{x,y,t}],ph}
const me={x:SPAWN[0],y:SPAWN[1],d:4,m:0,r:0,f:0};
const K={},view={};
function newWorld(){return {p:{},g:{x:PATROL[0][0],y:PATROL[0][1],d:4,s:'walk',wp:0,tx:0,ty:0},k:find('K').map(([x,y])=>({x,y,t:0})),ph:'lobby'};}
function addPlayer(id,n){const i=Object.keys(W0.p).length;W0.p[id]={x:SPAWN[0]+i*.6,y:SPAWN[1],d:4,m:0,r:0,down:0,n:n||('玩家'+(i+1)),c:COLS[i%4],rv:0};}
/* ---------- 連線 ---------- */
const st=t=>$('status').textContent=t;
function sendAll(o){const s=JSON.stringify(o);conns.forEach(c=>c.open&&c.send(s));}
function host(){
  const code=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
  peer=new Peer(PREFIX+code);isHost=true;$('lobbyMsg').textContent='建立中……';
  peer.on('open',id=>{myId=id;W0=newWorld();addPlayer(id,$('name').value.trim());$('lobby').classList.add('hide');$('roomP').classList.remove('hide');$('code').textContent=code;updWho();st('主機・房號 '+code);});
  peer.on('connection',c=>{
    c.on('open',()=>{if(Object.keys(W0.p).length>=4||W0.ph==='play'&&started&&false){c.send(JSON.stringify({t:'full'}));return;}conns.push(c);});
    c.on('data',raw=>{const m=JSON.parse(raw);
      if(m.t==='hi'){addPlayer(c.peer,m.n);updWho();sys(`${W0.p[c.peer].n} 加入了`);}
      else if(m.t==='in'){const p=W0.p[c.peer];if(p&&!p.down)Object.assign(p,{x:m.x,y:m.y,d:m.d,m:m.m,r:m.r});}
      else if(m.t==='chat'){relayChat(W0.p[c.peer]?.n||'?',m.s);}});
    c.on('close',()=>{conns=conns.filter(x=>x!==c);if(W0.p[c.peer]){sys(`${W0.p[c.peer].n} 離開了`);delete W0.p[c.peer];updWho();}});
  });
  peer.on('error',e=>{$('lobbyMsg').textContent='連線錯誤：'+e.type;});
}
function join(){
  const code=$('joinCode').value.trim().toUpperCase();if(code.length!==4){$('lobbyMsg').textContent='請輸入 4 碼房號';return;}
  peer=new Peer();$('lobbyMsg').textContent='連線中……';
  peer.on('open',id=>{myId=id;hostConn=peer.connect(PREFIX+code,{reliable:false});
    hostConn.on('open',()=>{hostConn.send(JSON.stringify({t:'hi',n:$('name').value.trim()}));$('lobby').classList.add('hide');st('已連線・房號 '+code);});
    hostConn.on('data',raw=>{const m=JSON.parse(raw);
      if(m.t==='w'){const first=!W0;W0=m.w;if(first||W0.ph==='play')started=W0.ph!=='lobby';if(W0.p[myId]&&first){me.x=W0.p[myId].x;me.y=W0.p[myId].y;}if(W0.p[myId]?.down)Object.assign(me,{x:W0.p[myId].x,y:W0.p[myId].y});}
      else if(m.t==='chat')chatLine(m.n,m.s);else if(m.t==='end')endGame(m.win);else if(m.t==='full')$('lobbyMsg').textContent='房間已滿';});
    hostConn.on('close',()=>{st('與主機斷線');sys('與主機的連線中斷了');});
    setTimeout(()=>{if(!hostConn.open)$('lobbyMsg').textContent='找不到這個房間（房號錯誤，或網路擋住了點對點連線）';},9000);});
  peer.on('error',e=>{$('lobbyMsg').textContent='連線錯誤：'+e.type;});
}
function updWho(){$('who').textContent='目前 '+Object.values(W0.p).map(p=>p.n).join('、');}
/* ---------- 聊天 ---------- */
function chatLine(n,s){const d=document.createElement('div');d.textContent=(n?n+'：':'')+s;$('log').appendChild(d);while($('log').childElementCount>6)$('log').firstChild.remove();}
const sys=s=>{chatLine('',s);if(isHost)sendAll({t:'chat',n:'',s});};
function relayChat(n,s){chatLine(n,s);sendAll({t:'chat',n,s});}
$('msg').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const s=$('msg').value.trim();$('msg').value='';$('msg').blur();if(!s)return;
  if(isHost)relayChat(W0.p[myId].n,s);else hostConn?.send(JSON.stringify({t:'chat',s}));});
/* ---------- 主機：裂口女、鑰匙、救援、勝負 ---------- */
function hostTick(dt){
  const g=W0.g,ps=Object.entries(W0.p).filter(([,p])=>!p.down);
  let tgt=null,bd=6.5;for(const [,p] of ps){const d=Math.hypot(p.x-g.x,p.y-g.y);if(d<bd&&los(g.x,g.y,p.x,p.y)){bd=d;tgt=p;}}
  let tx,ty,sp;
  if(tgt){g.s='chase';tx=tgt.x;ty=tgt.y;sp=3.3;}
  else{g.s='walk';const w=PATROL[g.wp];tx=w[0];ty=w[1];sp=1.6;if(Math.hypot(tx-g.x,ty-g.y)<.4)g.wp=(g.wp+1+(Math.random()*3|0))%PATROL.length;}
  const step=pathStep(g.x,g.y,tx,ty);if(step){const dx=step[0]-g.x,dy=step[1]-g.y,l=Math.hypot(dx,dy)||1;g.x+=dx/l*sp*dt;g.y+=dy/l*sp*dt;g.d=dirOf(dx,dy);}
  for(const [id,p] of Object.entries(W0.p)){
    if(!p.down&&Math.hypot(p.x-g.x,p.y-g.y)<.55){p.down=1;p.rv=0;sys(`${p.n} 被裂口女抓住了！快去扶她起來`);g.wp=(g.wp+3)%PATROL.length;}
    if(p.down){const helper=Object.values(W0.p).find(q=>q!==p&&!q.down&&Math.hypot(q.x-p.x,q.y-p.y)<1.2);p.rv=helper?p.rv+dt:0;if(p.rv>=2){p.down=0;p.rv=0;sys(`${p.n} 被扶起來了`);}}
    for(const k of W0.k)if(!k.t&&!p.down&&Math.hypot(p.x-k.x,p.y-k.y)<.7){k.t=1;sys(`${p.n} 找到了一把鑰匙（${W0.k.filter(q=>q.t).length} / ${W0.k.length}）`);}
  }
  const all=Object.values(W0.p);
  if(all.length&&all.every(p=>p.down)){W0.ph='lose';sendAll({t:'end',win:0});endGame(0);}
  else if(W0.k.every(k=>k.t)&&all.filter(p=>!p.down).every(p=>GATE.some(([x,y])=>Math.hypot(p.x-x,p.y-y)<1.6))){W0.ph='win';sendAll({t:'end',win:1});endGame(1);}
}
function los(x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/.25);for(let i=1;i<n;i++){const t=i/n;if(solid(x0+(x1-x0)*t,y0+(y1-y0)*t))return false;}return true;}
function pathStep(x0,y0,x1,y1){   // 格子 BFS，回傳下一個格子中心
  const sx=x0|0,sy=y0|0,gx=x1|0,gy=y1|0;if(sx===gx&&sy===gy)return [x1,y1];
  const prev=new Map([[sx+','+sy,null]]),q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift();if(x===gx&&y===gy)break;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(prev.has(k)||at(nx,ny)==='#')continue;prev.set(k,x+','+y);q.push([nx,ny]);}}
  let k=gx+','+gy;if(!prev.has(k))return null;while(prev.get(k)&&prev.get(k)!==sx+','+sy)k=prev.get(k);const [cx,cy]=k.split(',').map(Number);return [cx+.5,cy+.5];
}
/* ---------- 操作 ---------- */
addEventListener('keydown',e=>{if(document.activeElement===$('msg'))return;K[e.code]=1;if(e.code==='Enter'&&started){$('msg').focus();e.preventDefault();}});
addEventListener('keyup',e=>{K[e.code]=0;});
const T={id:null,x:0,y:0,dx:0,dy:0};
cv.addEventListener('pointerdown',e=>{T.id=e.pointerId;T.x=e.clientX;T.y=e.clientY;T.dx=T.dy=0;});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==T.id)return;T.dx=e.clientX-T.x;T.dy=e.clientY-T.y;});
const tEnd=e=>{if(e.pointerId===T.id){T.id=null;T.dx=T.dy=0;}};cv.addEventListener('pointerup',tEnd);cv.addEventListener('pointercancel',tEnd);
function dirOf(dx,dy){const sx=dx-dy,sy=(dx+dy)/2,a=Math.atan2(sy,sx);return [6,5,4,3,2,1,0,7][((Math.round(a/(Math.PI/4))%8)+8)%8];}
function localMove(dt){
  if(!W0||!started||W0.p[myId]?.down){me.m=0;return;}
  let sx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),sy=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);
  if(T.id!==null&&Math.hypot(T.dx,T.dy)>12){const l=Math.hypot(T.dx,T.dy);sx=T.dx/l;sy=T.dy/l;}
  // 螢幕方向 → 地圖方向（斜角）
  let dx=sx+sy,dy=sy-sx;const l=Math.hypot(dx,dy);me.m=l>.1?1:0;me.r=K.ShiftLeft||K.ShiftRight||(T.id!==null&&Math.hypot(T.dx,T.dy)>70)?1:0;
  if(!me.m)return;dx/=l;dy/=l;const sp=(me.r?4:2.4)*dt;
  if(free(me.x+dx*sp,me.y))me.x+=dx*sp;if(free(me.x,me.y+dy*sp))me.y+=dy*sp;me.d=dirOf(dx,dy);me.f+=dt*(me.r?10:7);
}
/* ---------- 繪圖（斜角） ---------- */
let VW=0,VH=0,cam={x:0,y:0};
function resize(){VW=cv.width=Math.round(innerWidth/2);VH=cv.height=Math.round(innerHeight/2);ctx.imageSmoothingEnabled=false;}addEventListener('resize',resize);resize();
const iso=(x,y)=>[Math.round((x-y)*16-cam.x+VW/2),Math.round((x+y)*8-cam.y+VH/2)];
function drawSpr(img,cols,rows,x,y,d,f,a=1,tag,col){
  if(!img.complete||!img.naturalWidth)return;const fw=img.width/cols,fh=img.height/rows,[sx,sy]=iso(x,y);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(sx,sy,8,3.5,0,0,7);ctx.fill();
  ctx.globalAlpha=a;const h=fh*.68,w=fw*.68;ctx.drawImage(img,d*fw,(f%rows)*fh,fw,fh,sx-w/2,sy-h+1,w,h);ctx.globalAlpha=1;
  if(tag){ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(tag,sx+1,sy-h-2);ctx.fillStyle=col;ctx.fillText(tag,sx,sy-h-3);}
}
function draw(t){
  if(cv.width!==Math.round(innerWidth/2)||cv.height!==Math.round(innerHeight/2))resize();   // 剛載入時視窗大小可能還是 0
  ctx.fillStyle='#050507';ctx.fillRect(0,0,VW,VH);if(!W0)return;
  const [px,py]=[(me.x-me.y)*16,(me.x+me.y)*8];cam.x+=(px-cam.x)*.15;cam.y+=(py-cam.y)*.15;
  const list=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=at(x,y);const [sx,sy]=iso(x,y);if(sx<-40||sx>VW+40||sy<-40||sy>VH+60)continue;
    if(c==='#')list.push({d:x+y+1,f:()=>{const [a,b]=iso(x,y);ctx.fillStyle='#2b2630';ctx.beginPath();ctx.moveTo(a,b-22);ctx.lineTo(a+16,b-14);ctx.lineTo(a+16,b+10);ctx.lineTo(a,b+2);ctx.lineTo(a-16,b+10);ctx.lineTo(a-16,b-14);ctx.closePath();ctx.fill();ctx.fillStyle='#3e3744';ctx.beginPath();ctx.moveTo(a,b-22);ctx.lineTo(a+16,b-14);ctx.lineTo(a,b-6);ctx.lineTo(a-16,b-14);ctx.closePath();ctx.fill();}});
    else{ctx.fillStyle=c==='G'?'#4a3a22':((x+y)%2?'#232028':'#1e1b22');ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+16,sy+8);ctx.lineTo(sx,sy+16);ctx.lineTo(sx-16,sy+8);ctx.closePath();ctx.fill();}}
  for(const k of W0.k)if(!k.t)list.push({d:k.x+k.y,f:()=>{const [a,b]=iso(k.x,k.y);const on=Math.sin(t/200+k.x)>0;ctx.fillStyle=on?'#ffe08a':'#a8893f';ctx.fillRect(a-3,b-6,6,3);ctx.fillRect(a+1,b-4,2,4);}});
  for(const [id,p] of Object.entries(W0.p)){
    const v=id===myId?me:(view[id]=view[id]||{x:p.x,y:p.y});if(id!==myId){v.x+=(p.x-v.x)*.35;v.y+=(p.y-v.y)*.35;}
    const mv=id===myId?me.m:p.m,run=id===myId?me.r:p.r,d=id===myId?me.d:p.d,fr=mv?(run?5:1)+((t/(run?90:130))|0)%4:0;
    list.push({d:v.x+v.y,f:()=>{drawSpr(IMG.mi,8,9,v.x,v.y,d,p.down?0:fr,p.down?.45:1,p.n+(p.down?'（倒地）':''),p.c);
      if(p.down&&p.rv>0){const [a,b]=iso(v.x,v.y);ctx.strokeStyle='#8be08b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(a,b-30,6,-Math.PI/2,-Math.PI/2+p.rv/2*Math.PI*2);ctx.stroke();}}});
  }
  const g=W0.g;list.push({d:g.x+g.y,f:()=>drawSpr(g.s==='chase'?IMG.kuchisake_chase:IMG.kuchisake,8,4,g.x,g.y,g.d,(t/(g.s==='chase'?100:160)|0)%4)});
  list.sort((a,b)=>a.d-b.d).forEach(o=>o.f());
  // 黑暗與手電筒
  const [mx,my]=iso(me.x,me.y);const gr=ctx.createRadialGradient(mx,my-14,10,mx,my-14,130);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,5,.93)');ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);
  const kn=W0.k.filter(k=>k.t).length;
  $('hud').innerHTML=`鑰匙 <b>${kn} / ${W0.k.length}</b>${kn===W0.k.length?'　——全員到<b>校門</b>集合！':''}<br>玩家：${Object.values(W0.p).map(p=>`<span style="color:${p.c}">${p.n}${p.down?'✕':''}</span>`).join('、')}`;
}
/* ---------- 結束 ---------- */
function endGame(win){if($('endP').classList.contains('hide')===false)return;$('endT').textContent=win?'逃出去了！':'全員倒下……';$('endS').textContent=win?'校門在身後關上。四點四十四分，你們一起看著天亮。':'剪刀的聲音，在走廊盡頭停了下來。';$('endP').classList.remove('hide');}
/* ---------- 主迴圈 ---------- */
let last=performance.now(),sendT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  localMove(dt);
  if(W0){if(isHost){const p=W0.p[myId];if(p&&!p.down)Object.assign(p,{x:me.x,y:me.y,d:me.d,m:me.m,r:me.r});if(started&&W0.ph==='play')hostTick(dt);}
    sendT-=dt;if(sendT<=0){sendT=1/15;if(isHost)sendAll({t:'w',w:W0});else if(hostConn?.open&&started)hostConn.send(JSON.stringify({t:'in',x:+me.x.toFixed(2),y:+me.y.toFixed(2),d:me.d,m:me.m,r:me.r}));}}
  draw(now);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
